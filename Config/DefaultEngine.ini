[SystemSettings]
; --- Lumen 캐시 라이팅 노출 구간 ---------------------------------------------
;
; 화면에 뜨던 경고:
;   "Cached lighting in Lumen and real-time sky capture lighting is going to be
;    clipped. Please adjust r.EyeAdaptation.CachedLightingPreExposure ...
;    Exposure: -8.7. Safe exposure range: [-8.0, 12.0]."
;
; Lumen의 캐시된 라이팅과 실시간 스카이 캡처는 Float16에 담긴다. Float16의 EV 범위가
; [-14, +16]이고, 라이팅 응답이 잘리지 않으려면 아래 2스톱·위 8스톱을 남겨야 한다
; (PostProcessEyeAdaptation.cpp:247-251). 그래서 이 값 C에 대해
;
;     안전 구간 = [C - 12, C + 8]      (폭 20 EV로 고정. 창을 옮길 수만 있다)
;
; 엔진 기본값 4 → [-8, 12]. 그런데 이 장면의 노출이 **-8.7**이라 아래로 0.7 벗어났다.
; 2로 내리면 [-10, 10]이 되어 1.3 여유가 생기고, 위쪽도 10까지 남는다.
;
; ⚠ **이건 쇼케이스 맵 기준의 임시값이다.** 저택 맵을 새로 만들면 노출이 달라지므로
;    다시 맞춰야 한다. 맞추는 법은 간단하다 - 경고 문구가 그때의 Exposure와 안전 구간을
;    직접 찍어주므로, 그 값을 보고 `C = Exposure + 2`로 두면 구간 한가운데 온다.
;    콘솔에서 `r.EyeAdaptation.CachedLightingPreExposure <값>`으로 즉시 시험할 수 있다.
;
; 이 경고는 Lumen GI일 때만 뜬다.
r.EyeAdaptation.CachedLightingPreExposure=2
